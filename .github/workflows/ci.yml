# CI gate. Ensures the Rust engine builds against the committed Cargo.lock
# and runs the unit tests. Contract build + fork tests run via Foundry.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  bot:
    name: bot (build / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bot
      - name: Build
        run: cargo build --release --locked
      - name: Unit tests
        run: cargo test --release --locked --lib
      - name: Clippy
        continue-on-error: true
        run: cargo clippy --release --locked -- -W clippy::all
