# Goshawk — global config
cold_wallet             = ""
telegram_bot_token      = ""
telegram_chat_id        = 0
metrics_port            = 9090
rpc_timeout_secs        = 3
revm_sim_gas_limit      = 5_000_000
gas_estimate_safety_margin = 1.15
monitoring_gas_check_interval_blocks = 100
priority_fee_multiplier = 0.10
max_fee_base_multiplier = 2.0
min_profit_slippage_bps = 8000

# ─────────────────────────────────────────────────────────────────────────
[[chains]]
id                          = "ethereum"
chain_id                    = 1
rpc_ipc_or_ws               = ""
submission_mode             = "shadow"   # private_builder only after 09_SUBMISSION_AND_SIMULATION.md's relay integration is live-tested
lending_markets              = ["aave_v3_ethereum", "spark", "morpho_blue", "fluid", "compound_v3", "euler_v2"]
flash_priority                = ["morpho_blue", "balancer_v2", "spark_dss_flash", "aave_v3", "uniswap_v3_flash"]
swap_venues                   = ["uniswap_v3", "curve", "balancer"]
hf_gate.kind                  = "flat"
hf_gate.threshold             = 1.03
min_liquidation_profit_usd    = 750.0     # Ethereum flat floor — see 10_ECONOMICS_AND_RISK.md
liquidation_swap_haircut      = 0.02
liquidation_safety_factor     = 0.9
bootstrap_from_block          = 0
native_price_fallback_usd     = 2500.0
circuit_breaker_threshold     = 10        # tighter than any $50-floor L2 config — a mainnet revert costs materially more

